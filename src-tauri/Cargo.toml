[package]
name = "activity-tracker"
version = "1.1.3"
description = "Activity Tracker with GitHub-style contribution calendar"
authors = ["you"]
edition = "2021"

[lib]
name = "activity_tracker_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Held to 2.10 rather than left on a caret. `tauri build` refuses to run when this crate
# and @tauri-apps/api disagree on major.minor, the npm side is pinned to 2.10.1, and 2.10.2
# is the newest this crate has: a `cargo update` that moved it to 2.11 would break the
# build for a reason that looks unrelated to whatever prompted the update. The pair moves
# together or not at all.
tauri = { version = "~2.10", features = [] }
tauri-plugin-shell = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Every platform, not just the desktop: Android needs the same save dialog, where it is
# the system document picker instead of a portal.
#
# default-features = false drops this plugin's default "gtk3" backend, and that is the
# whole point of the line. With gtk3 the save dialog is a GTK dialog running inside the
# Flatpak sandbox: it would show the sandbox's own filesystem, the user would pick a
# location, and the file would land in the app's private directory again, which is exactly
# the bug the dialog is here to fix. xdg-portal routes the dialog through the desktop
# portal, so the path that comes back is the user's real one and no --filesystem
# permission is needed. The cost is that a Linux system with no portal running cannot open
# the dialog at all, and the app says so instead of hiding the file. The feature is inert
# off Linux, because rfd is not built for Windows dialogs, Android or iOS.
#
# Held to 2.7 for the same reason as tauri itself: @tauri-apps/plugin-dialog is pinned to
# 2.7.0, and 2.7.1 upwards require @tauri-apps/api 2.11, which has no matching tauri crate.
tauri-plugin-dialog = { version = "~2.7", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"

# Both of these are already compiled on Linux as dependencies of the dialog plugin (zbus
# arrives through ashpd and through tauri-plugin-opener, tokio through rfd), so declaring
# them adds nothing to the build. They are here to ask the desktop portal directly whether
# it is running, which is the only way to tell a cancelled dialog from one that never
# opened. See save_dialog_available in src/lib.rs.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
tokio = { version = "1", features = ["time"] }

# Android only. The document picker hands back a content:// URI rather than a path, and
# std::fs cannot write to one; this plugin resolves it through the platform. The desktop
# writes with the app's own command and has no use for this.
#
# Held to 2.5 like the others. The version check covers every plugin pair, not only tauri
# and @tauri-apps/api: this crate arrives on every platform anyway as a dependency of the
# dialog plugin, so a 2.4 npm package against a 2.5 crate failed the desktop builds too.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "~2.5"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = false
