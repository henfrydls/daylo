[package]
name = "activity-tracker"
version = "1.5.5"
description = "Activity Tracker with GitHub-style contribution calendar"
authors = ["you"]
edition = "2021"

[lib]
name = "activity_tracker_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Held to 2.10 rather than left on a caret. `tauri build` refuses to run when this crate
# and @tauri-apps/api disagree on major.minor, the npm side is pinned to 2.10.1, and 2.10.2
# is the newest this crate has: a `cargo update` that moved it to 2.11 would break the
# build for a reason that looks unrelated to whatever prompted the update. The pair moves
# together or not at all.
tauri = { version = "~2.10", features = [] }
tauri-plugin-shell = "2"
# For the anonymous check-in, and chosen over reqwest for two measured reasons. reqwest is
# already in the lock as somebody else's dependency, but there is no TLS backend in the
# tree at all — no rustls, no native-tls, no openssl — so either way the whole stack gets
# added and reqwest buys nothing. And this one is blocking with a tiny surface, which is
# what lets src/checkin.rs stay short enough to read in one sitting, which is the only
# guarantee anyone has about what the native side sends.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Every platform, not just the desktop: Android needs the same save dialog, where it is
# the system document picker instead of a portal.
#
# default-features = false drops this plugin's default "gtk3" backend, and that is the
# whole point of the line. With gtk3 the save dialog is a GTK dialog running inside the
# Flatpak sandbox: it would show the sandbox's own filesystem, the user would pick a
# location, and the file would land in the app's private directory again, which is exactly
# the bug the dialog is here to fix. xdg-portal routes the dialog through the desktop
# portal, so the path that comes back is the user's real one and no --filesystem
# permission is needed. The cost is that a Linux system with no portal running cannot open
# the dialog at all, and the app says so instead of hiding the file. The feature is inert
# off Linux, because rfd is not built for Windows dialogs, Android or iOS.
#
# Held to 2.7 for the same reason as tauri itself: @tauri-apps/plugin-dialog is pinned to
# 2.7.0, and 2.7.1 upwards require @tauri-apps/api 2.11, which has no matching tauri crate.
tauri-plugin-dialog = { version = "~2.7", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"

# One copy of Daylo at a time on the desktop: a second launch brings back the window that
# is already open instead of opening another one over the same data. See run() in
# src/lib.rs.
#
# Held to 2.4 because 2.5 asks for tauri ^2.12 and this crate is held to 2.10; 2.4.5 asks
# for ^2.10. There is no npm side to line up: the plugin has no JavaScript package, so
# `tauri build` has no pair to check for it. Every crate it needs was already in the lock.
tauri-plugin-single-instance = "~2.4"

# The updater, and the relaunch that finishes it. Desktop only, and not by preference:
# Tauri's updater does not exist on Android or iOS, where the store is the only route.
#
# Both are held to a tilde for the same reason as tauri itself, and the constraint that
# decides is the npm side rather than this one. Measured on 2026-09-26: the crate
# tauri-plugin-updater 2.12 still asks only for tauri ^2.10, but @tauri-apps/plugin-updater
# 2.12.0 requires @tauri-apps/api ^2.11, and this repository is pinned to 2.10.1 because
# that is the newest api the 2.10 tauri crate accepts. Taking the newest plugin would break
# `tauri build` at the version check, with an error about the api and not about the plugin.
tauri-plugin-updater = "~2.10"
tauri-plugin-process = "~2.3"

# Both of these are already compiled on Linux as dependencies of the dialog plugin (zbus
# arrives through ashpd and through tauri-plugin-opener, tokio through rfd), so declaring
# them adds nothing to the build. They are here to ask the desktop portal directly whether
# it is running, which is the only way to tell a cancelled dialog from one that never
# opened. See save_dialog_available in src/lib.rs. zbus also checks, before the single
# instance starts, that the plugin will not panic on the bus address or on its own names;
# see single_instance_can_start.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
tokio = { version = "1", features = ["time"] }

# Android only. The document picker hands back a content:// URI rather than a path, and
# std::fs cannot write to one; this plugin resolves it through the platform. The desktop
# writes with the app's own command and has no use for this.
#
# Held to 2.5 like the others. The version check covers every plugin pair, not only tauri
# and @tauri-apps/api: this crate arrives on every platform anyway as a dependency of the
# dialog plugin, so a 2.4 npm package against a 2.5 crate failed the desktop builds too.
# Adding a plugin here: its Kotlin models are built by Jackson through reflection, and the
# release build minifies, so they survive only because proguard-rules.pro keeps
# app.tauri.** with its members. Test on a release APK; a debug one does not minify and
# cannot reproduce the failure. docs/RELEASING.md explains what it looks like when it bites.
[target.'cfg(target_os = "android")'.dependencies]
# The mailto: of the feedback invitation needs this here: the shell plugin's open reaches
# for xdg-open through the `open` crate, and Android has none. See the comment in lib.rs.
tauri-plugin-opener = "2"
tauri-plugin-fs = "~2.5"
# Held to 2.3 and not left to resolve: the crate's 2.4.0 is fine against tauri 2.10, but
# its npm counterpart wants @tauri-apps/api 2.11, which has no matching tauri crate. 2.3.3
# on npm asks for ^2.8.0 and the pair lines up.
tauri-plugin-notification = "~2.3"
# Neither of these adds anything to the build: tao already compiles both on Android, and
# the versions here are the ones the lockfile already had. They are named so that src/
# can ask the phone a question directly. ndk-context is where tao leaves the JavaVM and
# the Activity while the app starts; jni is how they are used. See src/android.rs.
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Both are already in the tree through tauri and its dialog plugin; they are named here so
# the check for a missing WebView2 runtime can use them directly, before there is an app.
# winreg reads the version the runtime records about itself. rfd puts a system window on
# the screen without an event loop, which is the only kind of window that can exist at
# that point, and common-controls-v6 is what lets that window have buttons that say what
# they do instead of OK and Cancel.
winreg = "0.55"
# Also already in the tree through tauri, and named here for one call:
# GetCurrentPackageFullName, which is how a process asks whether it is running
# inside an MSIX package. A copy installed from the Microsoft Store is updated by
# the Store, so Daylo has nothing to say to it. See src/packaging.rs.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_Packaging_Appx"] }
rfd = { version = "0.16", features = ["common-controls-v6"] }

# Only for the test that reads tauri.conf.json and checks each `plugins.<name>` block
# against the config type that plugin actually accepts.
#
# The app registers these two on Android alone, but the failure they guard against is not
# platform specific: Tauri deserializes the block with serde_json::from_value in its own
# plugin initialisation, the same code on every target, and aborts the app when it does
# not fit. So the test needs the crates on whatever machine runs `cargo test`. Same
# version requirements as the real dependencies above, or the test would be checking a
# type the app does not ship.
[dev-dependencies]
tauri-plugin-fs = "~2.5"
tauri-plugin-notification = "~2.3"
# Only for the tests: it brings tauri::test::mock_app, which is what lets the commands be
# called for real instead of testing a helper next to them and hoping they use it.
tauri = { version = "~2.10", features = ["test"] }
# The integration test drives the updater directly. An integration test links only
# against the library and the dev-dependencies, so the plugin has to be named here as
# well as in the target section above.
tauri-plugin-updater = "~2.10"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = false

# The notification plugin, with two fixes that are not upstream yet.
#
# The first: a repeating notification is scheduled by two different pieces of code in that
# plugin, and they had drifted apart. The first firing reads the schedule's allowWhileIdle
# and arms setExactAndAllowWhileIdle on RTC_WAKEUP; every later one is re-armed by the
# plugin's own receiver with plain RTC, no wakeup and no idle allowance, because the
# receiver is handed an intent and the intent carries the cron string without the flag.
# So a daily reminder wakes a dozing phone the day it is set and, from the second night
# on, waits for the phone to be picked up. Asking Android for SCHEDULE_EXACT_ALARM
# without this buys one punctual reminder rather than punctual reminders.
#
# It matters without the permission too: for anybody who has not granted it, and for
# everybody on the Google Play build, which from 1.5.4 does not ask for it (the APK still
# does). Without it every alarm is inexact, and the
# fixed receiver re-arms with setAndAllowWhileIdle on RTC_WAKEUP, where the unfixed one
# used plain RTC: an inexact reminder that still wakes a dozing phone, instead of one that
# waits for it to be picked up. That much is read in the plugin's source; it has not been
# measured on a phone without the permission.
#
# The fix took two commits, because the first one was wrong in a way only a phone could
# show. It read the flag back from the plugin's own notification store, which looked safe
# since the receiver already loads from it two lines earlier, and that store was always
# empty. Measured on the Galaxy on 2026-10-13, the re-armed alarm came out exact and still
# without the idle allowance. The flag now rides on the intent, beside the cron string,
# which is how the receiver learns everything else it knows.
#
# The second (1.5.3): the reminder now survives a restart of the phone and an update of
# Daylo. The plugin has a receiver that puts its stored notifications back after a
# restart, and it never had anything to put back: `show`, the only command the Rust API
# reaches, stored nothing, and the one that did store would have written the string
# "null". Now `show` stores the request as it arrived from Rust, allowWhileIdle included,
# the receivers read it with a mapper configured like the plugin's own, and the same
# receiver also runs on MY_PACKAGE_REPLACED. Re-arming an alarm that is still there
# replaces it under the same id rather than adding a second, and leaves an unread reminder
# in the tray where it is. Each stored entry is restored on its own, the reminder is shown
# before anything else can fail, and an exact alarm is asked for only when the installed
# manifest still requests the permission, so the update that drops it does not arm one
# that Android removes a moment later. The plugin's unit tests run in Build Check
# (Android), in ci.yml.
#
# The update case is the reason this shipped before any build dropped
# SCHEDULE_EXACT_ALARM. Android removes an app's exact alarms when an update stops
# declaring that permission, and the receiver can only restore what the version before it
# stored. The APK never drops it; from 1.5.4 the Google Play build does, so a phone that
# moves from an APK it never opened at 1.5.3 to the Play build loses the reminder until
# Daylo is opened, as before. Opening 1.5.3 or later once is enough: that re-arms the
# reminder through `show`, and from then on it is stored.
#
# The third (#192, branch daylo/notification-2.3.3-reminder-192, on top of the second):
# - An interval can say when it may first fire (`notBefore`). Daylo asks for the start of
#   tomorrow when today is already logged, so the reminder does not ask how the day went
#   after it was logged, and still comes back every day after by itself.
# - The notification channel is called "Daily reminder" in the phone's settings instead of
#   "Default". Same id, so phones that have it see it renamed and keep its sound settings.
# - From Android 13, asking for the notification permission while it is already granted
#   replies "granted". It replied nothing, and the switch stayed busy for good.
#
# Pinned to a commit and not to a branch: a moving branch is a build that changes under
# us, and this one has to be the same bytes in CI, on a tag, and on the machine that
# measured it. The branch is based on notification-v2.3.3 and keeps that version number,
# which is what `~2.3` above and the 2.3.3 npm package both require: a patch whose
# version does not satisfy the requirement is silently not applied.
#
# It goes upstream once it has been measured on a phone over two nights.
[patch.crates-io]
tauri-plugin-notification = { git = "https://github.com/henfrydls/plugins-workspace", rev = "7276d808db001e343470e9ac0245062dfbf75667" }

# wry and tauri-runtime-wry, for #201: on Android Daylo could close by itself about ten
# seconds after opening. At startup tauri asks the webview its version; the question is
# asked from the Rust main thread and answered on the UI thread, and wry 0.54.1 waits ten
# seconds and then unwraps, so a UI thread busy for longer during a cold start aborted the
# process. Seen on the emulator, on the slowest starts only. It takes three changes
# together, two in wry and one in tauri-runtime-wry:
#
# 1. wry, asking side: the timeout comes back as an error instead of a panic.
# 2. wry, answering side: an answer that arrives after the question gave up is dropped.
#    Without this, once (1) stops the abort, the late answer panics on the UI thread.
# 3. tauri-runtime-wry: on Android an error there no longer means "no webview runtime".
#    Without this, (1) turns the crash into a window with no webview, which is worse
#    because nobody hears about it. macOS was already exempt the same way.
#
# The fork of tauri-runtime-wry takes tauri-runtime and tauri-utils from crates.io instead
# of from its own repository, or this patch would bring a second copy of each and stop
# matching the tauri crate from crates.io. Both branches keep their upstream version
# numbers (0.54.1 and 2.10.0), pinned by commit for the reason given above.
wry = { git = "https://github.com/henfrydls/wry", rev = "aa912399a3ae04d19663a17332d9f1c0cf997cae" }
tauri-runtime-wry = { git = "https://github.com/henfrydls/tauri", rev = "b59b732160546274e370fb911d76173a758278ad" }
