# One emulator for every measurement in test-build.yml (the reminder, measurement A of
# #202, the Activities sheet's gestures, and the Google Play build of #245), so the device
# they run on and the guard that keeps the check-in off production cannot drift apart
# between them.
#
# The caller checks the repository out first, puts the APKs it measures under apks/, and
# sets up Node 22 for cdp-eval.mjs. Whatever the script writes to `out` stays on the
# runner for the caller to upload, with the packet capture beside it.
name: Measure on an Android emulator
description: Boots the emulator with a packet capture, runs a measurement script on it, and fails if the check-in host or GitHub was reached from the device.

inputs:
  script:
    description: The command run once the emulator has booted
    required: true
  out:
    description: Folder, relative to the workspace, that the script writes to and the capture goes in
    required: true
  api-level:
    description: Android API level of the emulator. 34 unless a measurement says why not
    required: false
    default: '34'

runs:
  using: composite
  steps:
    - name: Let the runner use KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        # The emulator writes its capture here and will not create the folder.
        mkdir -p "${{ inputs.out }}"

    # The same emulator as smoke-android, plus -tcpdump: the emulator writes every packet
    # the device sends to a file on the runner. That is the record the check-in guard
    # below reads, and it is taken outside Android, so nothing the app or the system does
    # inside the device can keep a packet out of it.
    - name: Measure
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        target: google_apis
        arch: x86_64
        profile: pixel_2
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -tcpdump ${{ github.workspace }}/${{ inputs.out }}/emulator.pcap
        disable-animations: true
        script: ${{ inputs.script }}

    # Not one check-in may have left the emulator, and nothing may have gone to GitHub. Two
    # records say so, and either one naming a host fails the job: the script's (every
    # logcat line naming the check-in host has to be the app's own "did not go through",
    # see network.txt), and this capture of the emulator's network card, read by
    # capture-guard.py for the check-in host and for GitHub, by name and by GitHub's
    # published addresses. GitHub is here for the Google Play build (#245, #200): it must
    # never fetch the update manifest, and the manifest is a file on GitHub's releases. No
    # other measurement reaches GitHub either, so the rule costs them nothing.
    #
    # The capture is empty when the radio was off from the start, as it is here: the first
    # run of measurement A got a 24-byte file, a header and no packets. Empty is therefore
    # not a failure on its own; the logcat record is what shows the one attempt per install
    # failing.
    - name: Not one check-in left the emulator, and nothing reached GitHub
      if: always()
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail
        pcap="$OUT/emulator.pcap"
        cp apks/*.txt "$OUT/" 2>/dev/null || true
        if [ ! -s "$pcap" ] || [ "$(stat -c%s "$pcap")" -le 24 ]; then
          echo "::notice::The packet capture holds no packets: nothing went out on the emulator's network card."
          exit 0
        fi
        echo "capture: $(stat -c%s "$pcap") bytes"
        # The addresses GitHub serves its web and API hosts from. A capture with packets in
        # it that cannot be checked against them is not taken as clean.
        ranges="$OUT/github-ranges.txt"
        if ! gh api meta --jq '(.web + .api + .git)[]' >"$ranges" || [ ! -s "$ranges" ]; then
          echo "::error::GitHub's address ranges could not be read, so the capture was not checked."
          exit 1
        fi
        if ! python3 "$GITHUB_WORKSPACE/.github/scripts/capture-guard.py" "$pcap" "$ranges"; then
          echo "::error::The emulator sent something naming the check-in host or GitHub. If it was"
          echo "::error::the check-in, find the run in the server's rows and remove it. Either way,"
          echo "::error::close the path that let it out."
          exit 1
        fi
