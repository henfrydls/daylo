# One emulator for every measurement in test-build.yml (the reminder, measurement A of
# #202, and the Activities sheet's gestures), so the device they run on and the guard that
# keeps the check-in off production cannot drift apart between them.
#
# The caller checks the repository out first, puts the APKs it measures under apks/, and
# sets up Node 22 for cdp-eval.mjs. Whatever the script writes to `out` stays on the
# runner for the caller to upload, with the packet capture beside it.
name: Measure on an Android emulator
description: Boots the emulator with a packet capture, runs a measurement script on it, and fails if the check-in host left the device.

inputs:
  script:
    description: The command run once the emulator has booted
    required: true
  out:
    description: Folder, relative to the workspace, that the script writes to and the capture goes in
    required: true

runs:
  using: composite
  steps:
    - name: Let the runner use KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        # The emulator writes its capture here and will not create the folder.
        mkdir -p "${{ inputs.out }}"

    # The same emulator as smoke-android, plus -tcpdump: the emulator writes every packet
    # the device sends to a file on the runner. That is the record the check-in guard
    # below reads, and it is taken outside Android, so nothing the app or the system does
    # inside the device can keep a packet out of it.
    - name: Measure
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_2
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -tcpdump ${{ github.workspace }}/${{ inputs.out }}/emulator.pcap
        disable-animations: true
        script: ${{ inputs.script }}

    # Not one check-in may have left the emulator. Two records say so, and either one
    # naming the host fails the job: the script's (every logcat line naming the host has
    # to be the app's own "did not go through", see network.txt), and this capture of the
    # emulator's network card. The capture is empty when the radio was off from the
    # start, as it is here: the first run of measurement A got a 24-byte file, a header
    # and no packets. Empty is therefore not a failure on its own; the logcat record is
    # what shows the one attempt per install failing.
    - name: Not one check-in left the emulator
      if: always()
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        set -uo pipefail
        pcap="$OUT/emulator.pcap"
        cp apks/*.txt "$OUT/" 2>/dev/null || true
        if [ ! -s "$pcap" ] || [ "$(stat -c%s "$pcap")" -le 24 ]; then
          echo "::notice::The packet capture holds no packets: nothing went out on the emulator's network card."
          exit 0
        fi
        echo "capture: $(stat -c%s "$pcap") bytes"
        if python3 - "$pcap" <<'PY'
        import sys
        data = open(sys.argv[1], "rb").read()
        labels = b"\x07checkin\x09henfrydls\x03com"
        whole = b"checkin.henfrydls.com"
        found = [name for name, needle in (("DNS", labels), ("plain", whole)) if needle in data]
        print("check-in host in the capture:", ", ".join(found) if found else "nowhere")
        sys.exit(0 if found else 1)
        PY
        then
          echo "::error::The emulator sent something naming the check-in host. Find the run"
          echo "::error::in the server's rows and remove it, and close the path that let it out."
          exit 1
        fi
