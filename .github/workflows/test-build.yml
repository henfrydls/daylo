# Installers to run by hand before a version is tagged, because nothing gets released
# without somebody using it on a real machine first.
#
# WHAT IT CLAIMS: these are the same bundles release.yml would produce for the same five
# desktop targets plus the Android APK, built from the same code with the same release
# profile. The APK is signed with the release key, the same one release.yml uses, and the
# job refuses to upload it unless the certificate matches the one already on people's
# phones, so it installs over an existing Daylo instead of asking to uninstall it. The
# desktop bundles are not signed the way a release is: on macOS they carry the same ad hoc
# signature a release has, and nothing is notarized here or there.
# WHAT IT DOES NOT CLAIM: that any of it works. That is the point: a person installs it
# and tries the app.
#
# It cannot publish. There is no tag, no tauri-action, no release, and the only thing that
# leaves the runner is an artifact that expires in a week.
#
# On a pull request it runs when the 'build-installers' label is added, not on every push:
# five release builds with lto are expensive and most pushes do not need them. A label
# rather than only a manual dispatch because a workflow_dispatch does not appear until the
# file is on the default branch, which would be too late to test the branch that adds it.
#
# HOW TO RUN IT AGAIN. The trigger is the 'labeled' event, which fires on the transition
# and not on the state: adding a label the pull request already carries does nothing at
# all, silently. Take it off, check it is off, put it back:
#
#   gh pr edit <number> --remove-label build-installers
#   gh pr view <number> --json labels   # confirm it is gone before adding it again
#   gh pr edit <number> --add-label build-installers
#
# The better way in, and it does not need the label at all:
#
#   gh workflow run "Test build" --ref <branch>
#
# --ref both picks the branch to build and decides which copy of this file runs, so a
# branch that changes this workflow — or adds a job to it — is tested by its own version
# before it is merged, and there is nothing for an input to add. What has to be on the
# default branch for dispatch to be offered is the *file*, not the change: this one has
# been there since the workflow existed, which was mistaken for the opposite once and cost
# somebody a round of removing and re-adding a label for nothing.
#
# The label stays for a workflow that is genuinely new, where there is no file on the
# default branch yet and dispatch is not offered.
name: Test build

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

# Declared for the whole workflow rather than per job, so a job added later cannot quietly
# inherit the repository defaults. Nothing here publishes: it reads the code, builds it,
# and uploads an artifact, which needs no write of any kind.
permissions:
  contents: read

jobs:
  # The build matrix below is a copy of the one in release.yml, and a copy that drifts is
  # worse than no copy at all: this workflow exists so that what gets tested is what gets
  # shipped, and a target added to one file and not the other would quietly break that
  # promise while both workflows stayed green.
  #
  # The alternative was to make release.yml a reusable workflow and call it with
  # publish: false. That removes the copy but restructures the only path that publishes,
  # and the publishing half cannot be exercised without creating a real release, so the
  # first proof it still worked would arrive at a release. Comparing the two matrices
  # costs ten seconds and risks nothing.
  verify-matrix:
    name: The matrix still matches release.yml
    # The same condition as the build, so an unrelated label starts nothing at all.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-installers'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare the build matrices
        run: |
          python3 - <<'PY'
          import sys, yaml

          def matrix(path, job):
              with open(path) as handle:
                  workflow = yaml.safe_load(handle)
              entries = workflow["jobs"][job]["strategy"]["matrix"]["include"]
              # Only what decides the artifact: which target, and what gets bundled for
              # it. The runner label is deliberately not compared, so release.yml can move
              # to a newer image without failing this.
              return {(entry["target"], entry["args"]) for entry in entries}

          release = matrix(".github/workflows/release.yml", "build")
          test = matrix(".github/workflows/test-build.yml", "build")

          if release == test:
              print(f"both build the same {len(release)} targets")
              sys.exit(0)

          print("::error::The test build and the release build no longer agree.")
          for target, args in sorted(release - test):
              print(f"::error::released but never test built: {target} ({args})")
              print(f"::error::  add it to test-build.yml, or it ships without being run")
          for target, args in sorted(test - release):
              print(f"::error::test built but never released: {target} ({args})")
              print(f"::error::  remove it from test-build.yml, or drop it from release.yml")
          sys.exit(1)
          PY

  build:
    needs: verify-matrix
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-installers'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kept identical to release.yml. The job above fails if it stops being.
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - platform: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            target: aarch64-pc-windows-msvc
            name: windows-arm64
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            target: x86_64-apple-darwin
            name: macos-x64
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            target: aarch64-apple-darwin
            name: macos-arm64

    runs-on: ${{ matrix.platform }}
    name: Test build (${{ matrix.name }})
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # The same key release.yml uses, so this shares that cache rather than competing
          # with it for the repository's quota.
          shared-key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install Node.js dependencies
        run: npm ci

      # Which commit these installers came from, so a tester can say what they tested. On
      # a pull request github.sha is the merge commit, and the head is the interesting one.
      - name: Record the commit being built
        shell: bash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${sha:0:7}" >> "$GITHUB_ENV"

      # The CLI directly rather than tauri-action: with no tagName that action builds
      # without releasing, but calling the CLI makes it plain at a glance that nothing
      # here can publish.
      - name: Build the installers
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: daylo-${{ matrix.name }}-${{ env.SHORT_SHA }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          retention-days: 7
          # An empty upload would look like a build that succeeded with nothing to test,
          # which is the kind of check that cannot fail and therefore proves nothing.
          if-no-files-found: error

  # The APK, so the phone can be tested before a tag rather than after one. Signed with
  # the release key: Android refuses to install an update signed by a different key, and
  # uninstalling to get around that erases the data of a local-first app. An unsigned or
  # debug-signed test APK would therefore be untestable by anyone who already has Daylo.
  #
  # The key is no more exposed than it was. This workflow runs on a label or a manual
  # dispatch, both of which need write access to the repository, and anyone with write
  # access can already push a tag and run release.yml with the same key. Pull requests
  # from forks receive no secrets at all, which is why the job skips itself there rather
  # than failing on an empty secret. There is no pull_request_target here and there must
  # never be.
  android:
    name: Test build (android-apk)
    needs: verify-matrix
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-installers')
      && (github.event_name == 'workflow_dispatch'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Install Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # The same key release.yml uses for Android, so this shares that cache.
          workspaces: './src-tauri -> target'
          shared-key: android
          cache-on-failure: true

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli

      - name: Record the commit being built
        shell: bash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${sha:0:7}" >> "$GITHUB_ENV"

      - name: Build the APK
        run: npx tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - name: Sign it with the release key and check the certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          UNSIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          SIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/Daylo-android-arm64.apk"

          # The certificate every published Daylo carries, read off the 1.1.2 installed on
          # a real phone. It is not a secret: it travels inside every APK. It is here so
          # that a test build signed with the wrong key is caught by this job instead of by
          # a person whose phone refuses the install.
          EXPECTED="D6:2D:F3:2D:72:B1:54:87:C4:19:89:81:A7:35:0B:1D:74:F0:E6:60:71:A4:F8:95:88:86:AD:88:0C:45:F7:BD"

          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret $v. Not falling back to a generated key: an APK"
              echo "::error::signed with a different key cannot install over the one people"
              echo "::error::already have, and uninstalling erases their data."
              exit 1
            fi
          done

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          trap 'rm -f release.jks' EXIT

          BT="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)"
          "$BT/zipalign" -f 4 "$UNSIGNED" "$SIGNED"
          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            "$SIGNED"

          # apksigner's output is captured first so it can be both printed and parsed.
          # That also means the parsing below reads from a here-string, which has no
          # writer process, so an early-exiting consumer cannot kill anything with SIGPIPE
          # the way it would if apksigner were piped straight in.
          certs=$("$BT/apksigner" verify --print-certs "$SIGNED")
          echo "$certs"
          actual=$(grep -m1 -oE 'SHA-256 digest: [0-9a-f]+' <<< "$certs" | awk '{print $NF}' \
            | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')

          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::This APK is signed with a different certificate than the one"
            echo "::error::people already have, so it cannot be installed over their Daylo."
            echo "::error::expected $EXPECTED"
            echo "::error::got      $actual"
            exit 1
          fi
          echo "certificate matches the one on published Daylo installs"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: daylo-android-arm64-${{ env.SHORT_SHA || github.sha }}
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/Daylo-android-arm64.apk
          retention-days: 7
          if-no-files-found: error

  # Does it start?
  #
  # Every other check in this repository compiles the app and none of them run it, and
  # that gap has now shipped two APKs that died before drawing a frame: one where R8
  # stripped a constructor the plugin looks up by reflection, one where a plugins block
  # tauri.conf.json was not allowed to have aborted the process on the first frame. Both
  # builds were green everywhere. A person installed them and found out.
  #
  # So this job installs the app on an emulator and looks at it. Release, not debug, on
  # purpose: debug skips R8, and R8 is where one of those two bugs lived. The signature is
  # a throwaway generated here rather than the release key, because nothing leaves this
  # job and signing happens after R8, so it cannot change whether the app starts.
  #
  # Not on every pull request: this is ten minutes of emulator on top of an Android build,
  # and it belongs where the other test builds are, before a person is asked to install
  # something.
  smoke-android:
    name: Test build (android-smoke)
    needs: verify-matrix
    # Informative since 2026-09-12, not blocking. It still runs, still reports, and still
    # uploads its screenshot and log; what it no longer does is stop a test build.
    #
    # Three runs in a row suspended it. One was a bug in its own script. The other two were
    # real aborts of the app, with two different signatures, and both of them were the
    # emulator being slow: a destroyed-mutex abort during teardown, and a panic on
    # `rx.recv_timeout(MAIN_PIPE_TIMEOUT).unwrap()` in wry's Android bridge, which turns a
    # webview thread that answers late into SIGABRT because the release profile aborts on
    # panic. Every one of those runs had the emulator start badly — "Unable to connect to
    # adb daemon", 42 seconds to boot against the 31 of the run that passed.
    #
    # So it is measuring something true and not about this release: a device slow enough
    # will abort the app, and that risk lives upstream, not in the change under test. A
    # check that stops every build over an environment nobody is shipping teaches people to
    # ignore it, and an ignored check is a deleted check.
    #
    # What would make it blocking again: the upstream unwrap gone or routed around, and a
    # run of ten in a row where the only red is the app's own doing.
    continue-on-error: true
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-installers')
      && (github.event_name == 'workflow_dispatch'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      # x86_64, not aarch64: an emulator on a GitHub runner is x86_64 and an arm64 APK
      # would need full instruction translation, which is slow enough to be useless.
      - name: Install Rust stable with the emulator's Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Its own cache key. The other Android jobs cross compile for aarch64 and sharing a
      # key with them would have each evicting the other's artifacts every run.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: android-x86_64
          cache-on-failure: true

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli

      - name: Build the APK
        run: npx tauri android build --apk --target x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - name: Sign it with a throwaway key
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          # globstar because the ABI directory name is Tauri's to choose, not ours.
          apks=( src-tauri/gen/android/app/build/outputs/apk/**/release/*-unsigned.apk )
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::Expected exactly one unsigned release APK, found ${#apks[@]}."
            printf '::error::  %s\n' "${apks[@]}"
            exit 1
          fi

          keytool -genkeypair -keystore smoke.jks -alias smoke \
            -storepass smokesmoke -keypass smokesmoke \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Daylo smoke test, O=nobody, C=ZZ"

          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | tail -1)"
          "$BT/zipalign" -f 4 "${apks[0]}" smoke.apk
          "$BT/apksigner" sign --ks smoke.jks \
            --ks-pass pass:smokesmoke --key-pass pass:smokesmoke \
            --ks-key-alias smoke smoke.apk
          echo "SMOKE_APK=$PWD/smoke.apk" >> "$GITHUB_ENV"

      # The emulator will not start without it, and the runner's kvm device is root-only
      # until this rule is in place.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # For reading the screenshot below. Pillow rather than ImageMagick so the scoring
      # is a Python script that can be run against known-good and known-bad images on a
      # laptop, which is how its numbers were arrived at and how they stay checkable.
      - name: Install Pillow
        # The fallback is for a runner image whose Python is externally managed, where
        # pip refuses to write to it without being told; the flag does not exist on
        # older pip, so it cannot simply be passed always.
        run: python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow

      # API 34, and the level is load bearing for a reason that is not the Android
      # version. An emulator image carries a WebView baked in and no Play Store to update
      # it, so the image decides which browser the app runs in. The first green run of
      # this job was on API 30, whose AOSP image ships WebView 83.0.4103.120 — Chromium
      # 83, from 2020 — and Daylo's stylesheet opens with `@layer`, which Chromium
      # learned in 99. The whole block was skipped and the app painted a page with no
      # styling at all. It passed every check here and told us nothing, because no real
      # phone runs that WebView: on a device WebView comes from the Play Store.
      #
      # API 30 was chosen for `dumpsys activity exit-info`, which arrived in 30 and is
      # still here.
      - name: Start it and see whether it stays up
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - name: Upload what the screen looked like
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence
          path: |
            smoke-screenshot.png
            smoke-logcat.txt
          retention-days: 7
          if-no-files-found: warn
