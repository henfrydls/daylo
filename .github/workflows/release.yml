name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
            target: x86_64-pc-windows-msvc
            name: windows-x64
          # Windows ARM64
          - platform: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            target: aarch64-pc-windows-msvc
            name: windows-arm64
          # Linux x64
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          # macOS x64 (Intel)
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            target: x86_64-apple-darwin
            name: macos-x64
          # macOS ARM64 (Apple Silicon)
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            target: aarch64-apple-darwin
            name: macos-arm64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Rust cache
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.target }}

      # Linux dependencies for Tauri 2.x
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # Install Node.js dependencies
      - name: Install Node.js dependencies
        run: npm ci

      # Build the Tauri app
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows | `.exe` | Installer (NSIS). x64 and ARM64 available. |
            | macOS | `.dmg` | Disk image. Intel and Apple Silicon available. |
            | Linux | `.deb`, `.AppImage` | Debian package or portable AppImage. x64. |
            | Android | `.apk` | Direct install. arm64 devices only (all phones/tablets since ~2017). |

            ### Android install
            1. Download `Daylo-android-arm64.apk` on your phone
            2. Open the file and allow "Install from unknown sources" if prompted
            3. The app does not require any special permissions
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Build (android-apk)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Install Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: android

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli

      - name: Build Android APK (arm64 only)
        run: npx tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          ALIGNED_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/Daylo-android-arm64.apk"

          # El keystore TIENE que venir de secrets. Antes se generaba aqui con
          # 'keytool -genkey', lo que producia una llave nueva en cada build que solo
          # existia en este runner. Android exige firma identica para actualizar, asi
          # que cada APK publicado asi queda incapaz de recibir actualizaciones: el
          # usuario tiene que desinstalar, y siendo la app local-first, eso le borra
          # los datos. Preferimos que el build falle antes que publicar eso otra vez.
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::No hay ANDROID_KEYSTORE_BASE64 en secrets. Se aborta en vez de"
            echo "::error::generar una llave efimera: un APK firmado con llave distinta a la"
            echo "::error::de la version anterior no se puede instalar encima, y desinstalar"
            echo "::error::borra los datos locales del usuario."
            echo "::error::Configura ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,"
            echo "::error::ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD en los secrets del repo."
            exit 1
          fi
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(eval echo "\${$v:-}")" ]; then
              echo "::error::Falta el secret $v"; exit 1
            fi
          done

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          trap 'rm -f release.jks' EXIT

          BT="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)"

          "$BT/zipalign" -f 4 "$APK_PATH" "$ALIGNED_PATH"

          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            "$ALIGNED_PATH"

          # Dejar el fingerprint en el log del build. Si algun dia la llave vuelve a
          # cambiar, se ve aqui y no seis meses despues en el APK publicado.
          echo "--- firma del APK que se va a publicar ---"
          "$BT/apksigner" verify --print-certs "$ALIGNED_PATH" | grep -iE 'SHA-256|Subject'

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/Daylo-android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create a summary job that runs after all builds complete
  release-summary:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "All builds completed successfully!"
            echo "Release artifacts have been uploaded to: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          else
            echo "Some builds failed. Check the individual build logs for details."
            exit 1
          fi

      - name: Publicar copias con nombre estable y SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          mkdir -p assets && cd assets

          # El sha256 de cada asset ya lo publica la API, asi que no hay que rehashear
          # nada. Se lee ANTES de subir las copias para que el mapa contenga solo los
          # originales; cada copia hereda despues el hash del asset del que sale.
          declare -A digest_de
          # Se cuenta a mano en vez de usar ${#digest_de[@]}: con 'set -u' un array
          # ASOCIATIVO declarado y vacio da "unbound variable" al consultar su longitud
          # (los indexados no), asi que la guarda de abajo no llegaria a evaluarse nunca.
          n_assets=0
          while read -r sha nombre; do
            if [ -n "${nombre:-}" ]; then
              digest_de["$nombre"]="$sha"
              n_assets=$((n_assets + 1))
            fi
          done < <(gh api "repos/$REPO/releases/tags/$TAG" \
                     --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"')
          if [ "$n_assets" -eq 0 ]; then
            echo "::error::La API no devolvio ningun asset para $TAG. Sin los digest no se"
            echo "::error::puede publicar SHA256SUMS.txt sin descargar y hashear todo."
            exit 1
          fi

          # Solo se descarga lo que hay que renombrar. El AppImage son 81 MB, tres cuartas
          # partes del peso de la release, y no se copia (duplicarlo no se justifica hasta
          # que 'strip' lo adelgace), asi que no se baja: su hash sale de la API igual. El
          # APK ya se publica con su nombre definitivo y tampoco hace falta tocarlo.
          gh release download "$TAG" --repo "$REPO" --clobber \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.deb' || true

          # Copias con nombre estable para que la landing pueda enlazar a
          # /releases/latest/download/<nombre> sin la version dentro de la URL. Los
          # nombres versionados se conservan: quien archive instaladores los distingue.
          #
          # Cada copia se trata de forma INDEPENDIENTE y a proposito. Si el runner de una
          # plataforma falla (ocurre, y no por culpa del codigo), la release existe sin ese
          # artefacto; abortar aqui dejaria sin copia fija a las plataformas que SI
          # compilaron, y sus enlaces en la landing darian 404. Un build caido degrada una
          # fila de la tabla, no todas.
          #
          # AVISO para quien añada mas jobs de empaquetado: los patrones de abajo ABORTAN si
          # uno casa con mas de un archivo. Si algun dia un job sube a ESTA MISMA release
          # otro instalador de Windows -- por ejemplo el paquete de la Microsoft Store, que
          # necesita webviewInstallMode=offlineInstaller y pesa mas de 100 MB frente a los
          # 2 MB del NSIS -- tiene que llamarse de forma que NO case con
          # 'Daylo_*_x64-setup.exe', o este paso se cae y ninguna plataforma recibe su copia.
          subidos=()
          faltantes=()
          declare -A origen_de

          preparar() {
            local patron="$1" destino="$2" candidatos=() f n origen
            # Se comprueba la existencia real de cada candidato en vez de fiarse del glob:
            # 'nullglob' solo elimina los patrones CON comodin.
            for f in $patron; do [ -f "$f" ] && candidatos+=("$f"); done
            n=${#candidatos[@]}
            if [ "$n" -eq 0 ]; then
              echo "::warning::Ningun asset casa con '$patron'; se omite $destino. Su enlace"
              echo "::warning::en la landing dara 404 hasta la proxima release que lo incluya."
              faltantes+=("$destino")
              return 0
            fi
            if [ "$n" -gt 1 ]; then
              # Ambiguedad real: elegir mal publicaria un binario bajo un nombre que
              # promete otra cosa.
              echo "::error::'$patron' casa con $n archivos y no se puede elegir:"
              printf '::error::  %s\n' "${candidatos[@]}"
              exit 1
            fi
            origen="${candidatos[0]}"
            if ! cp "$origen" "$destino"; then
              echo "::error::No se pudo copiar '$origen' a '$destino'"
              exit 1
            fi
            subidos+=("$destino")
            origen_de["$destino"]="$origen"
            echo "  $origen -> $destino"
          }

          preparar 'Daylo_*_x64-setup.exe'    Daylo-windows-x64-setup.exe
          preparar 'Daylo_*_arm64-setup.exe'  Daylo-windows-arm64-setup.exe
          preparar 'Daylo_*_aarch64.dmg'      Daylo-macos-apple-silicon.dmg
          preparar 'Daylo_*_x64.dmg'          Daylo-macos-intel.dmg
          preparar 'Daylo_*_amd64.deb'        Daylo-linux-amd64.deb

          if [ ${#subidos[@]} -eq 0 ]; then
            echo "::error::No se preparo ninguna copia fija: la release no tiene assets de"
            echo "::error::escritorio con los nombres esperados."
            exit 1
          fi

          gh release upload "$TAG" --repo "$REPO" --clobber "${subidos[@]}" || {
            echo "::error::Fallo la subida de las copias con nombre estable."; exit 1; }

          # SHA256SUMS con todo lo publicado. Los instaladores de escritorio no van
          # firmados, asi que Windows y macOS avisan de "editor desconocido"; este fichero
          # es lo unico que permite al usuario comprobar por su cuenta que lo que bajo es
          # lo que construyo el CI, sin tener que creerse nuestra palabra.
          : > SHA256SUMS.txt
          for nombre in "${!digest_de[@]}"; do
            printf '%s  %s\n' "${digest_de[$nombre]}" "$nombre" >> SHA256SUMS.txt
          done
          for copia in "${subidos[@]}"; do
            orig="${origen_de[$copia]}"
            sha="${digest_de[$orig]:-}"
            if [ -z "$sha" ]; then
              echo "::error::La API no dio digest de '$orig', asi que no se puede publicar"
              echo "::error::el hash de su copia '$copia' sin calcularlo a mano."
              exit 1
            fi
            printf '%s  %s\n' "$sha" "$copia" >> SHA256SUMS.txt
          done
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"; cat SHA256SUMS.txt

          gh release upload "$TAG" --repo "$REPO" --clobber SHA256SUMS.txt || {
            echo "::error::Fallo la subida de SHA256SUMS.txt."; exit 1; }

          # Resumen visible en la portada del run: un ::warning:: se pierde entre los logs,
          # y que falte una plataforma tiene que verse sin abrir nada.
          {
            echo "### Assets con nombre estable"
            echo
            echo "| Copia | Estado |"
            echo "|---|---|"
            for a in "${subidos[@]}"; do echo "| \`$a\` | publicada |"; done
            for a in "${faltantes[@]+"${faltantes[@]}"}"; do echo "| \`$a\` | **FALTA** (build no disponible) |"; done
            echo
            echo "\`SHA256SUMS.txt\` cubre $(grep -c . SHA256SUMS.txt) archivos, con los hashes"
            echo "que publica la propia API de releases."
          } >> "$GITHUB_STEP_SUMMARY"
