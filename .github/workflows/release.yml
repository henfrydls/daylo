name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
            target: x86_64-pc-windows-msvc
            name: windows-x64
          # Windows ARM64
          - platform: windows-latest
            args: --target aarch64-pc-windows-msvc --bundles nsis
            target: aarch64-pc-windows-msvc
            name: windows-arm64
          # Linux x64
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          # macOS x64 (Intel)
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            target: x86_64-apple-darwin
            name: macos-x64
          # macOS ARM64 (Apple Silicon)
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            target: aarch64-apple-darwin
            name: macos-arm64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Rust cache
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.target }}

      # Linux dependencies for Tauri 2.x
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # Install Node.js dependencies
      - name: Install Node.js dependencies
        run: npm ci

      # Build the Tauri app
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your platform below.

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows | `.exe` | Installer (NSIS). x64 and ARM64 available. |
            | macOS | `.dmg` | Disk image. Intel and Apple Silicon available. |
            | Linux | `.deb`, `.AppImage` | Debian package or portable AppImage. x64. |
            | Android | `.apk` | Direct install. arm64 devices only (all phones/tablets since ~2017). |

            ### Android install
            1. Download `Daylo-android-arm64.apk` on your phone
            2. Open the file and allow "Install from unknown sources" if prompted
            3. The app does not require any special permissions
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Build (android-apk)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Install Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: android

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli

      - name: Build Android APK (arm64 only)
        run: npx tauri android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          ALIGNED_PATH="src-tauri/gen/android/app/build/outputs/apk/universal/release/Daylo-android-arm64.apk"

          # El keystore TIENE que venir de secrets. Antes se generaba aqui con
          # 'keytool -genkey', lo que producia una llave nueva en cada build que solo
          # existia en este runner. Android exige firma identica para actualizar, asi
          # que cada APK publicado asi queda incapaz de recibir actualizaciones: el
          # usuario tiene que desinstalar, y siendo la app local-first, eso le borra
          # los datos. Preferimos que el build falle antes que publicar eso otra vez.
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::No hay ANDROID_KEYSTORE_BASE64 en secrets. Se aborta en vez de"
            echo "::error::generar una llave efimera: un APK firmado con llave distinta a la"
            echo "::error::de la version anterior no se puede instalar encima, y desinstalar"
            echo "::error::borra los datos locales del usuario."
            echo "::error::Configura ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,"
            echo "::error::ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD en los secrets del repo."
            exit 1
          fi
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(eval echo "\${$v:-}")" ]; then
              echo "::error::Falta el secret $v"; exit 1
            fi
          done

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          trap 'rm -f release.jks' EXIT

          BT="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)"

          "$BT/zipalign" -f 4 "$APK_PATH" "$ALIGNED_PATH"

          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "env:ANDROID_KEY_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            "$ALIGNED_PATH"

          # Dejar el fingerprint en el log del build. Si algun dia la llave vuelve a
          # cambiar, se ve aqui y no seis meses despues en el APK publicado.
          echo "--- firma del APK que se va a publicar ---"
          "$BT/apksigner" verify --print-certs "$ALIGNED_PATH" | grep -iE 'SHA-256|Subject'

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/Daylo-android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # La demo web de la landing. La aplicacion es 100% web -- Tauri solo la envuelve --
  # asi que un 'vite build' con base '/demo/' produce un sitio estatico que funciona bajo
  # esa ruta, sin contenedor ni servidor. Verificado en un navegador real: renderiza, no da
  # 404 y el ciclo de crear, marcar y recargar conserva los datos.
  #
  # El artefacto sale LIMPIO, sin analitica: el script de la landing lo inyecta el
  # despliegue del sitio web sobre este mismo artefacto. Asi el repositorio de la
  # aplicacion no contiene nada que exista solo para la web.
  build-demo:
    name: Build web demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build demo with /demo/ base
        run: npx vite build --base=/demo/ --outDir dist-demo

      - name: Ajustar el manifest de la PWA a /demo/
        run: node scripts/fix-demo-manifest.mjs dist-demo /demo/

      - name: Comprobar que el artefacto sale sin analitica
        run: |
          # Defensa en profundidad con la MISMA lista que el CI, no con una copia
          # recortada: comprueba lo que de verdad se va a desplegar. Si algun dia el
          # script de la landing acabara aqui por error, el deploy publicaria una demo que
          # llama a casa con el mismo bundle que empaqueta la aplicacion de escritorio.
          #
          # '--solo-textos' porque es un bundle: los nombres de paquete desaparecen al
          # minificar y las cadenas de URL no.
          scripts/check-no-analytics.sh --solo-textos dist-demo
          echo "index.html: $(wc -c < dist-demo/index.html) bytes, rutas con base /demo/"

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: daylo-web-demo
          path: dist-demo/
          retention-days: 90
          if-no-files-found: error

  # Create a summary job that runs after all builds complete
  release-summary:
    needs: [build, build-android, build-demo]
    runs-on: ubuntu-latest
    # El repositorio tiene default_workflow_permissions en "read", asi que sin declarar
    # esto 'gh release upload' devuelve 403. Los otros dos jobs ya lo declaran; este no
    # lo necesitaba hasta que empezo a publicar assets.
    permissions:
      contents: write
    # 'always()' correria tambien cuando se cancela el run, y entonces se publicarian
    # copias fijas y un SHA256SUMS.txt que solo cubre lo subido hasta ese instante. La
    # comprobacion de cobertura no protege de eso: los dos conteos verian la misma
    # release a medias.
    if: ${{ !cancelled() }}
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" == "success" ] && [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "All builds completed successfully!"
            echo "Release artifacts have been uploaded to: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          else
            echo "Some builds failed. Check the individual build logs for details."
            exit 1
          fi

      # 'always()' es imprescindible: el paso anterior hace 'exit 1' si algun build
      # fallo, y sin esto este paso no correria nunca en ese caso -- con lo que un runner
      # de macOS caido dejaria sin copia de nombre fijo a Windows, Linux y Android, que
      # SI compilaron, y romperia sus enlaces. La degradacion por plataforma de
      # 'preparar' solo sirve si el paso llega a ejecutarse.
      - name: Publicar copias con nombre estable y SHA256SUMS
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          mkdir -p assets && cd assets

          # El sha256 de cada asset ya lo publica la API, asi que no hay que rehashear
          # nada. Se lee ANTES de subir las copias para que el mapa contenga solo los
          # originales; cada copia hereda despues el hash del asset del que sale.
          # Cuantos assets deberia haber, para detectar un mapa truncado.
          n_esperados=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets | length') || {
            echo "::error::No se pudo consultar la lista de assets de $TAG."; exit 1; }

          declare -A digest_de
          # Se cuenta a mano en vez de usar ${#digest_de[@]}: con 'set -u' un array
          # ASOCIATIVO declarado y vacio da "unbound variable" al consultar su longitud
          # (los indexados no), asi que la guarda de abajo no llegaria a evaluarse nunca.
          n_assets=0
          # El digest se saca con '// ""' y 'sub' en vez de 'ltrimstr': si un asset trae
          # digest nulo, 'ltrimstr' aborta jq con "startswith() requires string inputs"
          # DESPUES de haber emitido las lineas anteriores. Al ir en sustitucion de
          # procesos, 'pipefail' no ve ese fallo, asi que el mapa quedaria truncado en
          # silencio y el job saldria verde con un SHA256SUMS.txt incompleto.
          #
          # El NOMBRE va primero y el digest despues, no al reves: el tab es whitespace,
          # asi que 'read' colapsa un primer campo vacio y desplaza los valores -- con el
          # digest delante, un asset sin digest hacia que el nombre acabara en la variable
          # del sha y la del nombre quedara vacia. Con el nombre primero, que nunca esta
          # vacio, un digest ausente se ve como lo que es y se puede nombrar el asset.
          while IFS=$'\t' read -r nombre sha; do
            [ -z "${nombre:-}" ] && continue
            if [ -z "${sha:-}" ]; then
              echo "::error::La API no trae digest del asset '$nombre'. Sin el no se puede"
              echo "::error::publicar su hash sin descargarlo y calcularlo a mano."
              exit 1
            fi
            digest_de["$nombre"]="$sha"
            n_assets=$((n_assets + 1))
          done < <(gh api "repos/$REPO/releases/tags/$TAG" \
                     --jq '.assets[] | [.name, ((.digest // "") | sub("^sha256:";""))] | @tsv')

          if [ "$n_assets" -eq 0 ]; then
            echo "::error::La API no devolvio ningun asset para $TAG. Sin los digest no se"
            echo "::error::puede publicar SHA256SUMS.txt sin descargar y hashear todo."
            exit 1
          fi
          if [ "$n_assets" -ne "${n_esperados:-0}" ]; then
            echo "::error::La API devolvio $n_assets digest de $n_esperados assets. Publicar"
            echo "::error::un SHA256SUMS.txt incompleto es peor que no publicarlo."
            exit 1
          fi

          # Solo se descarga lo que hay que renombrar. El AppImage son 81 MB, tres cuartas
          # partes del peso de la release, y no se copia (duplicarlo no se justifica hasta
          # que 'strip' lo adelgace), asi que no se baja: su hash sale de la API igual. El
          # APK ya se publica con su nombre definitivo y tampoco hace falta tocarlo.
          gh release download "$TAG" --repo "$REPO" --clobber \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.deb' || {
            # 'gh release download' tambien sale 1 cuando simplemente no hay nada que case,
            # que es lo que pasa si fallaron los cinco builds de escritorio. Eso no es un
            # fallo de descarga, y decirlo asi manda a mirar al sitio equivocado. Se avisa
            # y se sigue: 'preparar' informara de cada copia que falte, y el SHA256SUMS
            # del APK -- que si existe -- se publica igual.
            echo "::warning::La descarga no trajo ningun instalador de escritorio para $TAG."
            echo "::warning::O fallaron esos builds, o la release no los tiene todavia."
          }

          # Copias con nombre estable para que la landing pueda enlazar a
          # /releases/latest/download/<nombre> sin la version dentro de la URL. Los
          # nombres versionados se conservan: quien archive instaladores los distingue.
          #
          # Cada copia se trata de forma INDEPENDIENTE y a proposito. Si el runner de una
          # plataforma falla (ocurre, y no por culpa del codigo), la release existe sin ese
          # artefacto; abortar aqui dejaria sin copia fija a las plataformas que SI
          # compilaron, y sus enlaces en la landing darian 404. Un build caido degrada una
          # fila de la tabla, no todas.
          #
          # AVISO para quien añada mas jobs de empaquetado: los patrones de abajo ABORTAN si
          # uno casa con mas de un archivo. Si algun dia un job sube a ESTA MISMA release
          # otro instalador de Windows -- por ejemplo el paquete de la Microsoft Store, que
          # necesita webviewInstallMode=offlineInstaller y pesa mas de 100 MB frente a los
          # 2 MB del NSIS -- tiene que llamarse de forma que NO case con
          # 'Daylo_*_x64-setup.exe', o este paso se cae y ninguna plataforma recibe su copia.
          subidos=()
          faltantes=()
          declare -A origen_de

          preparar() {
            local patron="$1" destino="$2" candidatos=() f n origen
            # Se comprueba la existencia real de cada candidato en vez de fiarse del glob:
            # 'nullglob' solo elimina los patrones CON comodin.
            for f in $patron; do [ -f "$f" ] && candidatos+=("$f"); done
            n=${#candidatos[@]}
            if [ "$n" -eq 0 ]; then
              echo "::warning::Ningun asset casa con '$patron'; se omite $destino. Su enlace"
              echo "::warning::en la landing dara 404 hasta la proxima release que lo incluya."
              faltantes+=("$destino")
              return 0
            fi
            if [ "$n" -gt 1 ]; then
              # Ambiguedad real: elegir mal publicaria un binario bajo un nombre que
              # promete otra cosa.
              echo "::error::'$patron' casa con $n archivos y no se puede elegir:"
              printf '::error::  %s\n' "${candidatos[@]}"
              exit 1
            fi
            origen="${candidatos[0]}"
            if ! cp "$origen" "$destino"; then
              echo "::error::No se pudo copiar '$origen' a '$destino'"
              exit 1
            fi
            subidos+=("$destino")
            origen_de["$destino"]="$origen"
            echo "  $origen -> $destino"
          }

          preparar 'Daylo_*_x64-setup.exe'    Daylo-windows-x64-setup.exe
          preparar 'Daylo_*_arm64-setup.exe'  Daylo-windows-arm64-setup.exe
          preparar 'Daylo_*_aarch64.dmg'      Daylo-macos-apple-silicon.dmg
          preparar 'Daylo_*_x64.dmg'          Daylo-macos-intel.dmg
          preparar 'Daylo_*_amd64.deb'        Daylo-linux-amd64.deb

          if [ ${#subidos[@]} -eq 0 ]; then
            # No se aborta: puede ser una release donde solo salio el APK. Abortar aqui
            # tiraria tambien el SHA256SUMS.txt, que cubre los assets que SI existen, y
            # dejaria la release sin ninguna forma de verificar la descarga.
            echo "::warning::No se preparo ninguna copia con nombre estable: la release no"
            echo "::warning::tiene instaladores de escritorio con los nombres esperados."
            echo "::warning::Todos los enlaces /releases/latest/download/ daran 404 hasta"
            echo "::warning::la proxima release que los incluya. SHA256SUMS.txt se publica"
            echo "::warning::igual, con los assets que haya."
          fi

          # SHA256SUMS con todo lo publicado. Los instaladores de escritorio no van
          # firmados, asi que Windows y macOS avisan de "editor desconocido"; este fichero
          # es lo unico que permite al usuario comprobar por su cuenta que lo que bajo es
          # lo que construyo el CI, sin tener que creerse nuestra palabra.
          #
          # Se construye ANTES de subir nada, para hacer una sola subida al final.
          : > SHA256SUMS.txt
          for nombre in "${!digest_de[@]}"; do
            # En un re-run la release ya contiene el SHA256SUMS.txt anterior y las copias
            # fijas de la vez pasada. Sin estos dos saltos, el fichero se referenciaria a
            # si mismo con su hash viejo -- 'sha256sum -c' daria FAILED sobre el propio
            # fichero -- y las copias saldrian duplicadas, una por cada bucle.
            [ "$nombre" = "SHA256SUMS.txt" ] && continue
            ya_es_copia=0
            for c in "${subidos[@]}"; do
              [ "$nombre" = "$c" ] && { ya_es_copia=1; break; }
            done
            [ "$ya_es_copia" -eq 1 ] && continue
            printf '%s  %s\n' "${digest_de[$nombre]}" "$nombre" >> SHA256SUMS.txt
          done
          for copia in "${subidos[@]}"; do
            orig="${origen_de[$copia]}"
            sha="${digest_de[$orig]:-}"
            if [ -z "$sha" ]; then
              # Puede pasar si la API trajo el asset con digest nulo: mejor abortar que
              # publicar una linea sin hash, que 'sha256sum -c' leeria como formato roto.
              echo "::error::La API no dio digest de '$orig', asi que no se puede publicar"
              echo "::error::el hash de su copia '$copia' sin calcularlo a mano."
              exit 1
            fi
            printf '%s  %s\n' "$sha" "$copia" >> SHA256SUMS.txt
          done
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"; cat SHA256SUMS.txt

          gh release upload "$TAG" --repo "$REPO" --clobber "${subidos[@]}" SHA256SUMS.txt || {
            echo "::error::Fallo la subida de los assets con nombre estable."; exit 1; }

          # Resumen visible en la portada del run: un ::warning:: se pierde entre los logs,
          # y que falte una plataforma tiene que verse sin abrir nada.
          {
            echo "### Assets con nombre estable"
            echo
            echo "| Copia | Estado |"
            echo "|---|---|"
            for a in "${subidos[@]}"; do echo "| \`$a\` | publicada |"; done
            for a in "${faltantes[@]+"${faltantes[@]}"}"; do echo "| \`$a\` | **FALTA** (build no disponible) |"; done
            echo
            echo "\`SHA256SUMS.txt\` cubre $(grep -c . SHA256SUMS.txt) archivos, con los hashes"
            echo "que publica la propia API de releases."
          } >> "$GITHUB_STEP_SUMMARY"
