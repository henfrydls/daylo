name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run tests and linting
  test:
    runs-on: ubuntu-22.04
    name: Test & Lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Rust cache
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux dependencies for Tauri 2.x
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # Install Node.js dependencies
      - name: Install Node.js dependencies
        run: npm ci

      # Run linting
      - name: Run ESLint
        run: npm run lint

      # Run TypeScript check
      - name: TypeScript check
        run: npx tsc --noEmit

      # Run unit tests with coverage
      - name: Run unit tests
        run: npm run test:coverage -- --run

      # Upload coverage report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # Check Rust code
      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      # Build frontend to ensure it compiles
      - name: Build frontend
        run: npm run build

  # Verify Tauri builds (without uploading artifacts)
  build-check:
    needs: test
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux
          - platform: windows-latest
            name: Windows
          - platform: macos-latest
            name: macOS

    name: Build Check (${{ matrix.name }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Rust cache
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux dependencies for Tauri 2.x
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # Install Node.js dependencies
      - name: Install Node.js dependencies
        run: npm ci

      # Build Tauri app (debug mode for faster CI)
      - name: Build Tauri app
        run: npm run tauri:build -- --debug

      # Smoke-run: comprobar que el binario ARRANCA, no solo que compila. Un fallo de
      # arranque que solo se da en una plataforma no lo detecta ningun test unitario, y
      # sin esto solo se veria cuando alguien descargase el binario publicado.
      #
      # QUE AFIRMA: "el codigo arranca en esta plataforma". Es un guardian por PR.
      # QUE NO AFIRMA: "el instalador que publicamos arranca". Aqui se prueba el perfil
      # --debug, sin pasar por NSIS ni por el DMG, y el binario lo acaba de compilar el
      # runner, asi que no lleva la marca de origen que dispara SmartScreen en Windows ni
      # Gatekeeper en macOS. Verificar el artefacto publicado es un test aparte, sobre
      # release.yml, que instalaria el paquete de verdad.
      - name: Smoke-run del binario (Linux y macOS)
        if: runner.os != 'Windows'
        run: |
          set -uo pipefail
          shopt -s nullglob
          BIN="src-tauri/target/debug/activity-tracker"
          if [ ! -x "$BIN" ]; then
            echo "::error::No se encontro el binario ejecutable en $BIN"
            ls -la src-tauri/target/debug/ 2>/dev/null | head -20
            exit 1
          fi

          XVFB_PID=""
          APP_PID=""
          limpiar() {
            [ -n "$APP_PID" ] && kill "$APP_PID" 2>/dev/null
            [ -n "$XVFB_PID" ] && kill "$XVFB_PID" 2>/dev/null
            return 0
          }
          trap limpiar EXIT

          if [ "$RUNNER_OS" = "Linux" ]; then
            # Xvfb propio en lugar de 'xvfb-run': ese script lanza el comando como hijo y
            # se queda en 'wait' (xvfb-run:200 no hace exec), asi que $! seria el PID del
            # envoltorio y no el de la app. Matar el envoltorio deja la app huerfana: no
            # recibe TERM, no corre su flush de cierre y no cierra limpiamente su SQLite.
            Xvfb :99 -screen 0 1280x1024x24 >xvfb.log 2>&1 &
            XVFB_PID=$!
            export DISPLAY=:99
            sleep 2
            if ! kill -0 "$XVFB_PID" 2>/dev/null; then
              # Distinguir esto del "el binario murio" evita diagnosticar la app por un
              # fallo del runner.
              echo "::error::Xvfb no arranco. El problema es del entorno del runner, no"
              echo "::error::del arranque de la aplicacion:"
              cat xvfb.log 2>/dev/null
              exit 1
            fi
            # Sin GPU ni /dev/dri, el WebProcess de WebKitGTK muere al crear buffers
            # DMABUF/GBM: el proceso principal sigue vivo pero el webview nunca carga.
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            export LIBGL_ALWAYS_SOFTWARE=1
          fi

          "$BIN" > smoke.log 2>&1 &
          APP_PID=$!

          # Se duerme y DESPUES se comprueba: al revés, la ultima comprobacion caeria en
          # t=9s y un binario que muere en el ultimo segundo pasaria la prueba.
          for i in $(seq 1 10); do
            sleep 1
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::El binario murio tras ~${i}s"
              cat smoke.log 2>/dev/null
              exit 1
            fi
          done
          echo "El proceso principal sigue vivo tras 10s"

          # "Vivo" no es "arrancado": si el webview falla, el proceso principal se queda
          # en pie con una ventana en blanco y el bucle de arriba lo daria por bueno.
          #
          # Se buscan los hijos DEL PID de la aplicacion, no procesos de webkit por
          # nombre en toda la maquina: un 'pgrep -f WebKitWebProcess' global daria un
          # falso positivo si el runner tuviera cualquier otra aplicacion GTK/WebKit
          # abierta. El webview arranca como hijo directo del binario (verificado: el
          # proceso principal tiene como hijos WebKitWebProcess y WebKitNetworkProcess).
          hijos=$(pgrep -P "$APP_PID" 2>/dev/null | wc -l)
          if [ "$hijos" -eq 0 ]; then
            echo "::error::El proceso principal vive pero no ha lanzado ningun proceso"
            echo "::error::hijo: el webview no llego a arrancar y la ventana estaria vacia."
            cat smoke.log 2>/dev/null
            exit 1
          fi
          echo "El webview arranco: $hijos procesos hijos del binario"
          pgrep -P "$APP_PID" 2>/dev/null | while read -r c; do
            echo "  - $c $(cat "/proc/$c/comm" 2>/dev/null || ps -p "$c" -o comm= 2>/dev/null)"
          done

          # Cierre limpio ANTES de mirar el almacenamiento. WebKit lleva el localStorage
          # en modo WAL y el checkpoint ocurre al cerrar: si se lee sin esperar a que el
          # proceso termine, el estado puede estar todavia solo en el -wal.
          kill -TERM "$APP_PID" 2>/dev/null
          wait "$APP_PID" 2>/dev/null
          APP_PID=""

          # Comprobacion extra solo en Linux, que es la ruta verificada. En macOS el
          # almacenamiento del webview vive en otro sitio y con otro formato, y hacerlo a
          # ciegas daria falsos negativos que bloquearian los PR.
          if [ "$RUNNER_OS" != "Linux" ]; then
            exit 0
          fi
          STORE="$HOME/.local/share/com.daylo.app/localstorage"
          # El glob incluye el -wal y el -shm a proposito: aunque ahora se cierra limpio,
          # leer solo el archivo base dependeria de que el checkpoint haya ocurrido.
          archivos=( "$STORE"/*localstorage* )
          if [ ${#archivos[@]} -eq 0 ]; then
            echo "::error::El proceso arranco pero no creo su almacenamiento en:"
            echo "::error::  $STORE"
            echo "::error::Lo que hay bajo el directorio de datos de la aplicacion:"
            find "$HOME/.local/share/com.daylo.app" -name '*localstorage*' 2>/dev/null
            ls -la "$HOME/.local/share/com.daylo.app" 2>/dev/null
            exit 1
          fi
          # El valor lo guarda WebKit en UTF-16LE, de ahi 'strings -e l'. Se comprueba la
          # forma del estado y no solo que el archivo exista: un almacenamiento creado y
          # vacio significaria que el webview arranco y la aplicacion no se inicializo.
          #
          # La salida se captura primero en vez de encadenar 'strings | grep': el -wal y
          # el -shm desaparecen cuando WebKit hace checkpoint al cerrar, asi que entre la
          # expansion del glob y la lectura pueden dejar de existir. 'strings' devuelve
          # entonces un codigo distinto de cero y, con 'pipefail', eso tumbaria el
          # pipeline entero -- dando por vacio un almacenamiento que si tiene el estado.
          contenido=$(strings -e l "${archivos[@]}" 2>/dev/null || true)
          if printf '%s' "$contenido" | grep -q '"activities"'; then
            echo "El store se inicializo y persistio su estado:"
            printf '%s' "$contenido" | grep -o '"selectedYear":[0-9]*' | head -1
          else
            echo "::error::El almacenamiento existe pero no contiene el estado del store:"
            echo "::error::el webview arranco y la aplicacion no llego a inicializarse."
            ls -la "$STORE"
            exit 1
          fi

      - name: Smoke-run del binario (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'src-tauri/target/debug/activity-tracker.exe'
          if (-not (Test-Path $rel)) {
            Write-Output "::error::No se encontro el binario en $rel"
            Get-ChildItem src-tauri/target/debug | Select-Object -First 20 | Format-Table Name
            exit 1
          }
          # Rutas absolutas: -FilePath y -RedirectStandard* se resuelven contra
          # [Environment]::CurrentDirectory, que no sigue a $PWD.
          $bin = (Resolve-Path $rel).Path
          $out = Join-Path $PWD 'smoke-out.log'
          $err = Join-Path $PWD 'smoke-err.log'

          $p = Start-Process -FilePath $bin -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            # Dormir y despues comprobar, para no dejar el ultimo segundo sin vigilar.
            for ($i = 1; $i -le 10; $i++) {
              Start-Sleep -Seconds 1
              if ($p.HasExited) {
                Write-Output "::error::El binario murio tras ~${i}s con codigo $($p.ExitCode)"
                if (Test-Path $err) { Get-Content $err }
                exit 1
              }
            }
            Write-Output "El proceso principal sigue vivo tras 10s"

            # "Vivo" no es "arrancado": sin escritorio interactivo, si WebView2 falla y
            # Tauri abre un dialogo modal, el proceso sigue en pie con la app rota.
            #
            # Se filtra por ParentProcessId en vez de buscar msedgewebview2 en toda la
            # maquina: un runner con cualquier otro proceso de WebView2 abierto daria un
            # falso positivo.
            $hijos = @(Get-CimInstance Win32_Process -Filter "ParentProcessId = $($p.Id)" -ErrorAction SilentlyContinue)
            if ($hijos.Count -eq 0) {
              Write-Output "::error::El proceso principal vive pero no ha lanzado ningun"
              Write-Output "::error::proceso hijo: WebView2 no arranco y la ventana estaria vacia."
              if (Test-Path $err) { Get-Content $err }
              exit 1
            }
            Write-Output "El webview arranco: $($hijos.Count) procesos hijos del binario"
            $hijos | ForEach-Object { Write-Output "  - $($_.ProcessId) $($_.Name)" }
          }
          finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
