name: Does the signing secret sign?

# By hand, and only by hand. It answers one question in about a minute, and the day to ask
# it is the day the key is set or rotated, not the day a release is due.
on:
  workflow_dispatch:

# The key is what an update is checked against. If it is wrong, nothing says so until a
# release is published and nobody can install it, and by then the release exists.
#
# What this covers that nothing else does: whoever set the secret checked that THEIR FILE
# signs. Between that file and this secret there is a `gh secret set`, and a single stray
# byte in there breaks the signing with an error about base64 that names nothing. So the
# file signing and the secret signing are two different facts, and only one of them had
# ever been observed.
jobs:
  sign:
    runs-on: ubuntu-22.04
    name: Sign something with it

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      # Nothing of the key is ever printed, on any path. The output is captured and only
      # ever searched, never echoed: a diagnostic step that dumps what it has to hand is
      # how a secret leaks, and the error path is the one nobody rehearses.
      #
      # The two failures are told apart and given our words. The CLI says "Invalid symbol"
      # for one and "Wrong password for that key" for the other, and six months from now
      # nobody will have that table to hand. Measured on 2026-09-26: a trailing newline or
      # a trailing space in the secret produces the first, which is exactly what an editor
      # adds on save.
      - name: Sign a throwaway file
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::There is no TAURI_SIGNING_PRIVATE_KEY secret in this repository."
            echo "::error::Nothing can be signed, so no release can be updated to."
            exit 1
          fi

          echo "a file that exists only to be signed" > throwaway.txt

          if npx tauri signer sign throwaway.txt > signer.log 2>&1; then
            echo "The secret signs. The key and the password in this repository match."
            exit 0
          fi

          if grep -q "Invalid symbol" signer.log; then
            echo "::error::The secret is not a whole key: something decodes wrong in it."
            echo "::error::The usual cause is one stray character, and the usual source is"
            echo "::error::an editor: the key file has no newline at the end and most editors"
            echo "::error::add one on save. Set it again straight from the file, with"
            echo "::error::gh secret set TAURI_SIGNING_PRIVATE_KEY < the-key-file"
          elif grep -q "Wrong password" signer.log; then
            echo "::error::The key is whole, but TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not"
            echo "::error::its password. A lost password makes the key as useless as a lost key."
          else
            echo "::error::Signing failed for a reason this check does not recognise."
            echo "::error::Open the job log: the signer's own output is in signer.log, which"
            echo "::error::is not printed here because it could carry key material."
          fi
          exit 1

      # Nothing of this leaves the runner, and the throwaway signature least of all.
      - name: Leave nothing behind
        if: always()
        run: rm -f throwaway.txt throwaway.txt.sig signer.log
