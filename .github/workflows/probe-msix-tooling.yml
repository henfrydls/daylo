# Throwaway probe: answers whether a Windows runner can package an MSIX, without which
# the Microsoft Store route does not exist. Tauri has no msix target (its list is deb,
# rpm, appimage, nsis, msi, app, dmg), so the package would have to be assembled with
# makeappx over what the build produces. Manual only: no push or tag triggers it.
#
# The verdict goes to the job summary, not to the colour of the check: "not viable" is a
# valid result for a probe, not a CI failure. The step ends green unless the workflow
# itself is broken.
name: Probe MSIX tooling

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Find the SDK and pack a test MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $notes = @()
          function Note($text) {
            Write-Host $text
            $script:notes += $text
          }

          # --- 1. Locate makeappx ----------------------------------------------------
          # Several roots are searched because the SDK is not always under
          # Program Files (x86), and the App Certification Kit ships its own copy.
          $roots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "$env:ProgramFiles\Windows Kits\10\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }

          # Sort by [version] rather than by text: bin\ also holds 'x86' and 'x64'
          # folders, and in text order they beat any '10.0.xxxxx.0'; 10.0.9.0 would also
          # beat 10.0.17763.0. The path this probe prints is the one that gets copied
          # into the real workflow.
          function Find-Tool($name, $roots) {
            $found = @()
            foreach ($root in $roots) {
              $versions = Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
                          Where-Object { $_.Name -as [version] } |
                          Sort-Object { [version]$_.Name } -Descending
              foreach ($v in $versions) {
                foreach ($arch in @('x64', 'arm64', 'x86')) {
                  $path = Join-Path $v.FullName "$arch\$name"
                  if (Test-Path $path) { $found += $path }
                }
              }
            }
            foreach ($ack in @(
              "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\$name",
              "$env:ProgramFiles\Windows Kits\10\App Certification Kit\$name"
            )) { if ($ack -and (Test-Path $ack)) { $found += $ack } }
            $onPath = (Get-Command $name -ErrorAction SilentlyContinue).Source
            if ($onPath) { $found += $onPath }
            return $found
          }

          foreach ($root in $roots) {
            Note "SDK root: $root"
            Get-ChildItem $root -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -as [version] } |
              Sort-Object { [version]$_.Name } -Descending |
              ForEach-Object { Note "  SDK version: $($_.Name)" }
          }

          $candidates = Find-Tool 'makeappx.exe' $roots
          $makeappx = $candidates | Select-Object -First 1
          if ($makeappx) { Note "makeappx: $makeappx  ($($candidates.Count) copies found)" }
          else { Note 'makeappx: NOT FOUND in any known root or on PATH' }

          # The other two are looked up the same way, by version and not by text: their
          # paths would get copied into the real workflow as well.
          foreach ($other in @('signtool.exe', 'makepri.exe')) {
            $theirs = Find-Tool $other $roots
            if ($theirs.Count -gt 0) { Note "$other : $($theirs[0])" } else { Note "$other : not found" }
          }

          # --- 2. Pack something valid ----------------------------------------------
          $verdict = ''
          if (-not $makeappx) {
            $verdict = 'NOT VIABLE on this image: without makeappx the SDK would have to be installed in the job, or the package built with makemsix.'
          } else {
            New-Item -ItemType Directory -Path probe -Force | Out-Null

            # The AppxManifest schema requires Executable to end in .exe and the logos to
            # be .png/.jpg/.jpeg. With a .txt makeappx rejects the package every time, and
            # the probe would answer "not viable" on a perfectly capable runner.
            Set-Content -Path probe\hello.exe -Value 'MZ' -NoNewline
            $png = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=='
            [IO.File]::WriteAllBytes((Join-Path $PWD "probe\logo.png"), [Convert]::FromBase64String($png))

            # The manifest is built as a list of lines: a PowerShell here-string must be
            # closed at column 0 and that breaks the indentation of the YAML block.
            $xml = @(
              '<?xml version="1.0" encoding="utf-8"?>',
              '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"',
              '         xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"',
              '         xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">',
              '  <Identity Name="DLSLabs.ThrowawayProbe" Publisher="CN=Probe" Version="0.0.0.1" ProcessorArchitecture="x64" />',
              '  <Properties>',
              '    <DisplayName>Probe</DisplayName>',
              '    <PublisherDisplayName>Probe</PublisherDisplayName>',
              '    <Logo>logo.png</Logo>',
              '  </Properties>',
              '  <Dependencies>',
              '    <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />',
              '  </Dependencies>',
              '  <Resources><Resource Language="en-us" /></Resources>',
              '  <Applications>',
              '    <Application Id="Probe" Executable="hello.exe" EntryPoint="Windows.FullTrustApplication">',
              '      <uap:VisualElements DisplayName="Probe" Description="Probe" BackgroundColor="transparent"',
              '        Square150x150Logo="logo.png" Square44x44Logo="logo.png" />',
              '    </Application>',
              '  </Applications>',
              '  <Capabilities>',
              '    <rescap:Capability Name="runFullTrust" />',
              '  </Capabilities>',
              '</Package>'
            )
            Set-Content -Path probe\AppxManifest.xml -Value $xml -Encoding UTF8

            # makeappx's own output is captured and noted: it is what tells apart "the
            # runner cannot do this" from "our test manifest is wrong", which are
            # opposite answers to the question this probe asks.
            $output = & $makeappx pack /d probe /p probe.msix /o 2>&1
            $rc = $LASTEXITCODE
            $exists = Test-Path probe.msix
            foreach ($line in $output) { Note "  makeappx: $line" }
            Note "makeappx exited with code $rc; probe.msix created: $exists"

            # Two separate axes. makeappx running and getting as far as validation already
            # answers the tooling question, even if it rejects this particular manifest.
            if ($rc -eq 0 -and $exists) {
              $verdict = "VIABLE. Tooling present and makeappx packed an MSIX of $((Get-Item probe.msix).Length) bytes."
            } else {
              $verdict = "VIABLE as far as tooling goes: makeappx ran and rejected the probe's manifest with code $rc. The failure is in the test manifest, not the runner. Read its output above."
            }
          }

          Note ''
          Note "VERDICT: $verdict"

          if ($env:GITHUB_STEP_SUMMARY) {
            $notes | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          # The probe's result lives in the summary. The colour of the check would only
          # mean the workflow itself broke, so makeappx's code is cleared.
          $global:LASTEXITCODE = 0
          exit 0
